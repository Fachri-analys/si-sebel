name: Docker Build and Push

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/sisebel:latest
          ${{ secrets.DOCKER_USERNAME }}/sisebel:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sisebel:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sisebel:buildcache,mode=max
    
    - name: Image digest
      run: echo ${{ steps.build.outputs.digest }}